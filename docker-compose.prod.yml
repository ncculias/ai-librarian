# Production overrides — run together with the base file:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# Ports bind to localhost so only the host reverse proxy (nginx) can reach
# the containers, and the frontend routes API calls through the /api proxy.
services:
  backend:
    ports: !override
      - 127.0.0.1:8000:8000
  frontend:
    ports: !override
      - 127.0.0.1:3000:5173
    environment:
      - VITE_API_URL=/api
      - VITE_HMR_OVERLAY=false
